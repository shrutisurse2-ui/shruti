services:
  - type: web
    name: aura-voice-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: AURA_ADMIN_USERNAME
        sync: false
      - key: AURA_ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
